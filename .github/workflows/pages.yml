name: Publish documentation

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'ci/pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      site_url: ${{ steps.privacy.outputs.site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Never auto-enable Pages: repository privacy does not make the site private.
      - name: Validate repository and Pages visibility
        id: privacy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/pages.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build for the configured Pages URL
        working-directory: website
        env:
          DOCUSAURUS_SITE_URL: ${{ steps.privacy.outputs.site_url }}
        run: npm ci && npm test && npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck visibility and URL immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SITE_URL: ${{ needs.build.outputs.site_url }}
        run: python3 ci/pages.py --expected-url "$EXPECTED_SITE_URL"
      - name: Publish Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
