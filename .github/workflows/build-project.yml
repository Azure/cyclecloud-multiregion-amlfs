name: Build cluster-init project

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional tag that must match the project version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build versioned native project
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: python scripts/build_project.py --release-dir dist --tag "$RELEASE_TAG"
      - name: Check release checksum
        working-directory: dist
        run: sha256sum --check -- *.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cluster-init-project
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
